name: StudyPal CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      INTERNAL_JWT_SECRET: test-internal-jwt-secret-at-least-32-chars-long
      JWT_ACCESS_SECRET: test-jwt-access-secret-at-least-32-chars-long
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate Prisma Schemas
        run: |
          pnpm --filter @studypal/identity exec prisma validate
          pnpm --filter @studypal/content exec prisma validate
          pnpm --filter @studypal/document exec prisma validate
          pnpm --filter @studypal/knowledge exec prisma validate
          pnpm --filter @studypal/assessment exec prisma validate
          pnpm --filter @studypal/progress exec prisma validate
          pnpm --filter @studypal/tutor exec prisma validate
          pnpm --filter @studypal/ai exec prisma validate

      - name: Generate Prisma Clients
        run: pnpm turbo run db:generate

      - name: Typecheck Monorepo
        run: pnpm turbo run typecheck

      - name: Run Unit & Contract Tests
        run: pnpm turbo run test

      - name: Build All Workspaces
        run: pnpm turbo run build

      - name: Verify Docker Compose Configuration
        run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet
